name: Publish MagicIAedit web preview

on:
  push:
    branches:
      - feature/magiciaedit-cloud-foundation
    paths:
      - "docs/preview/**"
      - ".github/workflows/preview-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: magiciaedit-preview-pages
  cancel-in-progress: true

jobs:
  publish-preview:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview source
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static preview
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/preview
      - name: Publish preview
        id: deployment
        uses: actions/deploy-pages@v4
