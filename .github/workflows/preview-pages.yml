name: Publish MagicIAedit web preview

on:
  push:
    branches:
      - feature/magiciaedit-cloud-foundation
    paths:
      - "docs/preview/**"
      - ".github/workflows/preview-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: magiciaedit-preview-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview source
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static preview
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/preview

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish preview
        id: deployment
        uses: actions/deploy-pages@v4
