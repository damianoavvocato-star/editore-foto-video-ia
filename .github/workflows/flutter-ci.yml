name: Flutter checks

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:
    inputs:
      force_full:
        description: 'Run Flutter, backend and Android preflight checks'
        required: true
        type: boolean
        default: true
      build_android_apk:
        description: 'Reserved for the final development phase 6; currently disabled'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      force_full: ${{ steps.filter.outputs.force_full }}
      flutter: ${{ steps.filter.outputs.flutter }}
      backend: ${{ steps.filter.outputs.backend }}
      android: ${{ steps.filter.outputs.android }}
    steps:
      - name: Checkout repository with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          INPUT_FORCE_FULL: ${{ github.event.inputs.force_full }}
        run: |
          set -euo pipefail
          force_full=false
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$INPUT_FORCE_FULL" == "true" ]]; then
            force_full=true
          fi
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --name-only "$PR_BASE_SHA...$HEAD_SHA" > changed-files.txt
          elif [[ "$EVENT_NAME" == "push" ]]; then
            if [[ -n "$BEFORE_SHA" && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
              git diff --name-only "$BEFORE_SHA...$HEAD_SHA" > changed-files.txt
            else
              git diff-tree --no-commit-id --name-only -r "$HEAD_SHA" > changed-files.txt
            fi
          else
            : > changed-files.txt
          fi
          # Validate the workflow itself with one full run whenever CI YAML changes.
          if grep -Eq '^\.github/workflows/' changed-files.txt; then force_full=true; fi
          flutter=false
          backend=false
          android=false
          while IFS= read -r file; do
            [[ -n "$file" ]] || continue
            case "$file" in
              lib/*|test/*|integration_test/*|pubspec.yaml|pubspec.lock|analysis_options.yaml) flutter=true ;;
            esac
            case "$file" in
              backend/*|requirements*.txt|pyproject.toml|pytest.ini|setup.cfg) backend=true ;;
            esac
            case "$file" in
              android/*|gradle/*|settings.gradle|settings.gradle.kts|build.gradle|build.gradle.kts|gradle.properties|pubspec.yaml|pubspec.lock) android=true ;;
            esac
          done < changed-files.txt
          if [[ "$force_full" == "true" ]]; then
            flutter=true
            backend=true
            android=true
          fi
          {
            echo "force_full=$force_full"
            echo "flutter=$flutter"
            echo "backend=$backend"
            echo "android=$android"
          } >> "$GITHUB_OUTPUT"
          echo "Changed paths:"
          cat changed-files.txt
          echo "Selected checks: flutter=$flutter backend=$backend android=$android force_full=$force_full"

  flutter-test:
    needs: [changes]
    if: needs.changes.outputs.flutter == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Verify project root
        run: test -f pubspec.yaml && test -d backend && test -d lib
      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
      - name: Show Flutter and Dart versions
        run: flutter --version
      - name: Resolve dependencies
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze
      - name: Run Flutter tests
        run: flutter test --reporter expanded

  backend-test:
    needs: [changes]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Verify project root
        run: test -f pubspec.yaml && test -d backend && test -d lib
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install FFmpeg for media integration tests
        run: |
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffprobe -version
      - name: Install backend dependencies and test runner
        run: python -m pip install -r backend/requirements.txt pytest
      - name: Run backend tests
        run: python -m pytest -q backend

  android-preflight:
    # Run only for Android/Gradle inputs or an explicitly full validation.
    # This validates configuration; it does not build an APK.
    needs: [changes]
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-android-preflight-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
      - name: Generate Android platform project
        run: flutter create --platforms=android --org com.editorefoto --project-name editore_foto_video_ia .
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Set Android compile SDK to 36
        run: |
          sed -i "s/compileSdk = flutter.compileSdkVersion/compileSdk = 36/" android/app/build.gradle.kts 2>/dev/null || true
          sed -i "s/compileSdk flutter.compileSdkVersion/compileSdk 36/" android/app/build.gradle 2>/dev/null || true
          sed -i "s/compileSdk = flutter.compileSdkVersion/compileSdk = 36/" android/app/build.gradle 2>/dev/null || true
          grep -n compileSdk android/app/build.gradle*
      - name: Cache Gradle distributions and dependencies
        uses: gradle/actions/setup-gradle@v4

      - name: Use smaller Gradle binary distribution
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          wrapper=gradle/wrapper/gradle-wrapper.properties
          sed -i 's/-all\\.zip/-bin\\.zip/' "$wrapper"
          grep '^distributionUrl=' "$wrapper"

      - name: Validate Gradle project configuration without building APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          # Gradle distribution downloads occasionally fail with transient 5xx
          # responses from the GitHub release redirect. Retry without masking
          # genuine Gradle configuration errors.
          for attempt in 1 2 3 4 5; do
            echo "Gradle preflight attempt ${attempt}/5"
            if ./gradlew --no-daemon help; then
              exit 0
            fi
            if [[ "${attempt}" -lt 5 ]]; then
              sleep $((attempt * 15))
            fi
          done
          echo "Gradle preflight failed after five attempts." >&2
          exit 1

  android-apk:
    # Hard-disabled until the explicitly authorized final development phase (phase 6).
    if: false
    needs: [flutter-test, backend-test, android-preflight]
    # Android scaffold is generated on the runner until platform files are
    # committed to the project. This keeps local sources platform-neutral.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify project root
        run: test -f pubspec.yaml && test -d backend && test -d lib

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-android-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}

      - name: Generate Android platform project
        run: flutter create --platforms=android --org com.editorefoto --project-name editore_foto_video_ia .

      - name: Resolve dependencies
        run: flutter pub get

      - name: Set Android compile SDK to 36
        run: |
          sed -i "s/compileSdk = flutter.compileSdkVersion/compileSdk = 36/" android/app/build.gradle.kts 2>/dev/null || true
          sed -i "s/compileSdk flutter.compileSdkVersion/compileSdk 36/" android/app/build.gradle 2>/dev/null || true
          sed -i "s/compileSdk = flutter.compileSdkVersion/compileSdk = 36/" android/app/build.gradle 2>/dev/null || true
          grep -n compileSdk android/app/build.gradle*
      - name: Build release APK
        run: flutter build apk --release

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: editore-foto-video-ia-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
