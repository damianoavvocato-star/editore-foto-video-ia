name: Flutter checks

on:
  push:
    branches: [ main, master, feature/magiciaedit-cloud-foundation ]
  pull_request:
  workflow_dispatch:
    inputs:
      force_full:
        description: 'Run Flutter, backend and Android preflight checks'
        required: true
        type: boolean
        default: true
      build_android_apk:
        description: 'Build a release APK and publish it as a downloadable artifact (requires all checks to pass)'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      force_full: ${{ steps.filter.outputs.force_full }}
      flutter: ${{ steps.filter.outputs.flutter }}
      backend: ${{ steps.filter.outputs.backend }}
      android: ${{ steps.filter.outputs.android }}
    steps:
      - name: Checkout repository with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          INPUT_FORCE_FULL: ${{ github.event.inputs.force_full }}
        run: |
          set -euo pipefail
          force_full=false
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$INPUT_FORCE_FULL" == "true" ]]; then
            force_full=true
          fi
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --name-only "$PR_BASE_SHA...$HEAD_SHA" > changed-files.txt
          elif [[ "$EVENT_NAME" == "push" ]]; then
            # The commit API may push a single commit without a complete before
            # range in webhook metadata. Classify the actual pushed commit.
            git show --pretty="" --name-only "$HEAD_SHA" > changed-files.txt
            if [[ ! -s changed-files.txt ]]; then
              echo "No changed paths were detected; running the full validation set."
              force_full=true
            fi
          else
            : > changed-files.txt
          fi
          # Validate the workflow itself with one full run whenever CI YAML changes.
          if grep -Eq '^\.github/workflows/' changed-files.txt; then force_full=true; fi
          flutter=false
          backend=false
          android=false
          while IFS= read -r file; do
            [[ -n "$file" ]] || continue
            case "$file" in
              lib/*|test/*|integration_test/*|pubspec.yaml|pubspec.lock|analysis_options.yaml) flutter=true ;;
            esac
            case "$file" in
              backend/*|requirements*.txt|pyproject.toml|pytest.ini|setup.cfg) backend=true ;;
            esac
            case "$file" in
              android/*|gradle/*|settings.gradle|settings.gradle.kts|build.gradle|build.gradle.kts|gradle.properties|pubspec.yaml|pubspec.lock) android=true ;;
            esac
          done < changed-files.txt
          if [[ "$force_full" == "true" ]]; then
            flutter=true
            backend=true
            android=true
          fi
          {
            echo "force_full=$force_full"
            echo "flutter=$flutter"
            echo "backend=$backend"
            echo "android=$android"
          } >> "$GITHUB_OUTPUT"
          echo "Changed paths:"
          cat changed-files.txt
          echo "Selected checks: flutter=$flutter backend=$backend android=$android force_full=$force_full"

  flutter-test:
    needs: [changes]
    if: needs.changes.outputs.flutter == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Verify project root
        run: test -f pubspec.yaml && test -d backend && test -d lib
      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
      - name: Show Flutter and Dart versions
        run: flutter --version
      - name: Resolve dependencies
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze
      - name: Run Flutter tests
        run: flutter test --reporter expanded

  backend-test:
    needs: [changes]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Verify project root
        run: test -f pubspec.yaml && test -d backend && test -d lib
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install FFmpeg for media integration tests
        run: |
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffprobe -version
      - name: Install backend dependencies and test runner
        run: python -m pip install -r backend/requirements.txt pytest
      - name: Run backend tests
        run: python -m pytest -q backend

  android-preflight:
    # Run only for Android/Gradle inputs or an explicitly full validation.
    # This validates configuration; it does not build an APK.
    needs: [changes]
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-android-preflight-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
      - name: Generate Android platform project
        run: flutter create --platforms=android,ios --org com.editorefoto --project-name editore_foto_video_ia .
      - name: Add Google Maven Central mirror for Gradle dependencies
        run: |
          python - <<'PY'
          from pathlib import Path
          settings = Path("android/settings.gradle.kts")
          content = settings.read_text()
          mirror = 'maven { url = uri("https://maven-central.storage-download.googleapis.com/maven2/") }'
          if mirror not in content:
              if "mavenCentral()" not in content:
                  raise SystemExit("Expected Maven Central repository declaration was not found.")
              content = content.replace("mavenCentral()", mirror + "\n            mavenCentral()")
              settings.write_text(content)
          print("Google-hosted Maven Central mirror configured before Maven Central fallback.")
          PY
      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Generate MagicIAedit launcher icon and native splash
        run: |
          python -m pip install --disable-pip-version-check cairosvg
          python tool/prepare_branding.py
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create
          python tool/configure_android_branding.py
      - name: Verify generated MagicIAedit launcher and splash assets
        run: |
          python - <<'PY'
          import json
          import struct
          from pathlib import Path

          root = Path(".")
          required = [
              root / "assets/branding/app_icon.png",
              root / "assets/branding/app_icon_foreground.png",
              root / "assets/branding/splash_logo.png",
          ]
          for path in required:
              if not path.is_file() or path.stat().st_size < 1024:
                  raise SystemExit(f"Missing or empty generated branding asset: {path}")
              with path.open("rb") as image:
                  header = image.read(24)
              if header[:8].hex() != "89504e470d0a1a0a":
                  raise SystemExit(f"Generated asset is not a PNG: {path}")
              width, height = struct.unpack(">II", header[16:24])
              if width < 512 or height < 512:
                  raise SystemExit(f"Branding asset resolution is too small: {path} ({width}x{height})")
              print(f"Verified {path}: {width}x{height}")

          android_icons = list((root / "android/app/src/main/res").glob("mipmap-*/ic_launcher.png"))
          if len(android_icons) < 4:
              raise SystemExit(f"Expected Android launcher icons in density buckets, found {len(android_icons)}")
          manifest = (root / "android/app/src/main/AndroidManifest.xml").read_text(encoding="utf-8")
          if 'android:label="MagicIAedit"' not in manifest or 'android:icon="@mipmap/ic_launcher"' not in manifest:
              raise SystemExit("Android app label or launcher icon reference is incorrect.")

          ios_info = root / "ios/Runner/Info.plist"
          ios_text = ios_info.read_text(encoding="utf-8")
          if "<key>CFBundleDisplayName</key>" not in ios_text or "<string>MagicIAedit</string>" not in ios_text:
              raise SystemExit("iOS display name is not configured as MagicIAedit.")
          ios_icons = root / "ios/Runner/Assets.xcassets/AppIcon.appiconset/Contents.json"
          if not ios_icons.is_file():
              raise SystemExit("iOS AppIcon asset catalog was not generated.")
          catalog = json.loads(ios_icons.read_text(encoding="utf-8"))
          for item in catalog.get("images", []):
              filename = item.get("filename")
              if filename and not (ios_icons.parent / filename).is_file():
                  raise SystemExit(f"iOS app icon file referenced but missing: {filename}")
          print(f"Verified {len(android_icons)} Android launcher density icons and iOS AppIcon catalog.")
          print("MagicIAedit Android/iOS branding verification passed.")
          PY
      - name: Set Android compile SDK to 36
        run: |
          sed -i "s/compileSdk = flutter.compileSdkVersion/compileSdk = 36/" android/app/build.gradle.kts 2>/dev/null || true
          sed -i "s/compileSdk flutter.compileSdkVersion/compileSdk 36/" android/app/build.gradle 2>/dev/null || true
          sed -i "s/compileSdk = flutter.compileSdkVersion/compileSdk = 36/" android/app/build.gradle 2>/dev/null || true
          grep -n compileSdk android/app/build.gradle*
      - name: Cache Gradle distributions and dependencies
        uses: gradle/actions/setup-gradle@v4

      - name: Use smaller Gradle binary distribution
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          wrapper=gradle/wrapper/gradle-wrapper.properties
          sed -i 's/-all\.zip/-bin\.zip/' "$wrapper"
          grep '^distributionUrl=' "$wrapper"

      - name: Validate Gradle project configuration without building APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          # Gradle distribution downloads occasionally fail with transient 5xx
          # responses from the GitHub release redirect. Retry without masking
          # genuine Gradle configuration errors.
          for attempt in 1 2 3 4 5; do
            echo "Gradle preflight attempt ${attempt}/5"
            # Bound each attempt: a stalled wrapper/download must not consume the
            # entire job timeout and prevent the retry loop from running.
            if timeout --signal=TERM --kill-after=20s 240s ./gradlew --no-daemon --console=plain help; then
              exit 0
            fi
            if [[ "${attempt}" -lt 5 ]]; then
              sleep $((attempt * 15))
            fi
          done
          echo "Gradle preflight failed after five attempts." >&2
          exit 1

  android-apk:
    # Manual opt-in only: build the APK after Flutter, backend and Android checks pass.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_android_apk == true && needs.flutter-test.result == 'success' && needs.backend-test.result == 'success' && needs.android-preflight.result == 'success' }}
    needs: [flutter-test, backend-test, android-preflight]
    # Android and iOS scaffolds are generated on the runner until platform files are
    # committed to the project. This keeps local sources platform-neutral.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify project root
        run: test -f pubspec.yaml && test -d backend && test -d lib

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-android-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}

      - name: Generate Android platform project
        run: flutter create --platforms=android,ios --org com.editorefoto --project-name editore_foto_video_ia .
      - name: Add Google Maven Central mirror for Gradle dependencies
        run: |
          python - <<'PY'
          from pathlib import Path
          settings = Path("android/settings.gradle.kts")
          content = settings.read_text()
          mirror = 'maven { url = uri("https://maven-central.storage-download.googleapis.com/maven2/") }'
          if mirror not in content:
              if "mavenCentral()" not in content:
                  raise SystemExit("Expected Maven Central repository declaration was not found.")
              content = content.replace("mavenCentral()", mirror + "\n            mavenCentral()")
              settings.write_text(content)
          print("Google-hosted Maven Central mirror configured before Maven Central fallback.")
          PY

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate MagicIAedit launcher icon and native splash
        run: |
          python -m pip install --disable-pip-version-check cairosvg
          python tool/prepare_branding.py
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create
          python tool/configure_android_branding.py
      - name: Verify generated MagicIAedit launcher and splash assets
        run: |
          python - <<'PY'
          import json
          import struct
          from pathlib import Path

          root = Path(".")
          required = [
              root / "assets/branding/app_icon.png",
              root / "assets/branding/app_icon_foreground.png",
              root / "assets/branding/splash_logo.png",
          ]
          for path in required:
              if not path.is_file() or path.stat().st_size < 1024:
                  raise SystemExit(f"Missing or empty generated branding asset: {path}")
              with path.open("rb") as image:
                  header = image.read(24)
              if header[:8].hex() != "89504e470d0a1a0a":
                  raise SystemExit(f"Generated asset is not a PNG: {path}")
              width, height = struct.unpack(">II", header[16:24])
              if width < 512 or height < 512:
                  raise SystemExit(f"Branding asset resolution is too small: {path} ({width}x{height})")
              print(f"Verified {path}: {width}x{height}")

          android_icons = list((root / "android/app/src/main/res").glob("mipmap-*/ic_launcher.png"))
          if len(android_icons) < 4:
              raise SystemExit(f"Expected Android launcher icons in density buckets, found {len(android_icons)}")
          manifest = (root / "android/app/src/main/AndroidManifest.xml").read_text(encoding="utf-8")
          if 'android:label="MagicIAedit"' not in manifest or 'android:icon="@mipmap/ic_launcher"' not in manifest:
              raise SystemExit("Android app label or launcher icon reference is incorrect.")

          ios_info = root / "ios/Runner/Info.plist"
          ios_text = ios_info.read_text(encoding="utf-8")
          if "<key>CFBundleDisplayName</key>" not in ios_text or "<string>MagicIAedit</string>" not in ios_text:
              raise SystemExit("iOS display name is not configured as MagicIAedit.")
          ios_icons = root / "ios/Runner/Assets.xcassets/AppIcon.appiconset/Contents.json"
          if not ios_icons.is_file():
              raise SystemExit("iOS AppIcon asset catalog was not generated.")
          catalog = json.loads(ios_icons.read_text(encoding="utf-8"))
          for item in catalog.get("images", []):
              filename = item.get("filename")
              if filename and not (ios_icons.parent / filename).is_file():
                  raise SystemExit(f"iOS app icon file referenced but missing: {filename}")
          print(f"Verified {len(android_icons)} Android launcher density icons and iOS AppIcon catalog.")
          print("MagicIAedit Android/iOS branding verification passed.")
          PY

      - name: Set Android compile SDK to 36
        run: |
          sed -i "s/compileSdk = flutter.compileSdkVersion/compileSdk = 36/" android/app/build.gradle.kts 2>/dev/null || true
          sed -i "s/compileSdk flutter.compileSdkVersion/compileSdk 36/" android/app/build.gradle 2>/dev/null || true
          sed -i "s/compileSdk = flutter.compileSdkVersion/compileSdk = 36/" android/app/build.gradle 2>/dev/null || true
          grep -n compileSdk android/app/build.gradle*
      - name: Build release APK
        run: flutter build apk --release

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: editore-foto-video-ia-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
