name: editore_foto_video_ia
description: Cross-platform AI photo and video editor starter for Android, iOS, and desktop.
publish_to: "none"
version: 0.1.0+12

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  file_picker: ^10.3.10
  video_player: ^2.9.2
  just_audio: ^0.10.5
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  flutter_secure_storage: ^9.2.4
  flutter_svg: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/branding/magiciaedit_mark.svg

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#0B0820"
  adaptive_icon_foreground: assets/branding/app_icon_foreground.png
  remove_alpha_ios: true
  min_sdk_android: 21

flutter_native_splash:
  color: "#0B0820"
  image: assets/branding/splash_logo.png
  android: true
  ios: true
  fullscreen: true
  android_12:
    color: "#0B0820"
    image: assets/branding/splash_logo.png
